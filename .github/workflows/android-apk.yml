name: Android APK
# Builds the Kotlin/Compose RustDeck launcher plus the upstream Horizon Android NativeActivity.
# Horizon main is tracked without pinning (D-005); minimal compatibility patches are applied (D-012).
# The engine Activity remains separate and must only be launched after game preparation. This early
# build still has no launcher-core integration or playable game. Manual or Android-source change test.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/upstream/**'
      - 'android/**'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out RustDeck
        uses: actions/checkout@v4
        with:
          path: rustdeck

      - name: Check out upstream Horizon main
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: main
          fetch-depth: 1
          path: horizon

      - name: Record upstream revision
        id: up
        working-directory: horizon
        run: |
          echo "sha=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
          echo "## Upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "horizon-rust/horizon @ $(git rev-parse HEAD) ($(git log -1 --format=%cs))" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply RustDeck patches and add the Android shell
        working-directory: horizon
        run: |
          set -euo pipefail
          for p in ../rustdeck/patches/upstream/*.patch; do
            echo "applying $p"
            git apply --check "$p"
            git apply "$p"
          done
          cp -r ../rustdeck/android/shell crates/rustdeck-android
          sed -i '0,/^members = \[/s//members = [\n    "crates\/rustdeck-android",/' Cargo.toml
          grep -n "rustdeck-android" Cargo.toml
          git status --short

      - name: Install Rust with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.7.5
        with:
          workspaces: horizon
          cache-on-failure: true

      - name: Point cargo at the Android NDK
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK"
          {
            echo "ANDROID_NDK_BIN=$BIN"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: cargo build rustdeck-android (Android, fast profile)
        working-directory: horizon
        run: |
          rustc --version
          cargo build --profile fast --target aarch64-linux-android -p rustdeck-android 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Package Compose launcher and Horizon native engine
        run: |
          set -euo pipefail
          SO=horizon/target/aarch64-linux-android/fast/librustdeck_android.so
          ls -l "$SO"
          "$ANDROID_NDK_BIN/llvm-strip" --strip-unneeded "$SO"
          mkdir -p rustdeck/app/src/main/jniLibs/arm64-v8a
          cp "$SO" rustdeck/app/src/main/jniLibs/arm64-v8a/librustdeck_android.so
          cd rustdeck
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../RustDeck-nightly.apk
          ls -lh ../RustDeck-nightly.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDeck-nightly-apk
          path: RustDeck-nightly.apk

      - name: Publish to the nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd rustdeck
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease \
            --title "RustDeck nightly (test build)" \
            --notes "RustDeck Android Compose launcher with the Horizon native engine payload. Early development; game preparation and gameplay are not yet implemented."
          gh release upload nightly ../RustDeck-nightly.apk --clobber
          gh release edit nightly --notes "Latest: run ${{ github.run_number }}, upstream horizon-rust/horizon @ ${{ steps.up.outputs.sha }}. RustDeck Android Compose launcher + Horizon native engine payload. Early development; game preparation and gameplay are not yet implemented."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: horizon/build.log
          if-no-files-found: ignore
